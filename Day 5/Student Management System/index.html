<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <h2>StudentHub</h2>

        <div class="nav-links">
            <a href="#home">Home</a>
            <a href="#add-student">Add Student</a>
            <a href="#view-students">View Students</a>
        </div>
    </nav>

    <!-- Main Title -->
    <header id="home">
        <h1>Student Management System</h1>
        <p>Manage your student details in one place.</p>
    </header>

    <main>
        <!-- Add Student Form -->
        <section class="card" id="add-student">
            <h2>Add New Student</h2>

            <form id="studentForm">

                <label for="name">Student Name</label>
                <input type="text" id="name"
                       placeholder="Enter student name" required>

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone"
                       placeholder="Enter phone number"
                       pattern="[0-9]{10}" required>

                <label for="collegeId">College ID</label>
                <input type="text" id="collegeId"
                       placeholder="Enter college ID" required>

                <label for="email">Email Address</label>
                <input type="email" id="email"
                       placeholder="Enter email address" required>

                <button type="submit">Add Student</button>

            </form>
        </section>

        <!-- View Students -->
        <section class="card" id="view-students">
            <h2>All Students</h2>

            <p>Total Students: <strong id="totalStudents">0</strong></p>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Phone</th>
                            <th>College ID</th>
                            <th>Email</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="studentTable">
                        <!-- JavaScript adds student rows here -->
                    </tbody>
                </table>
            </div>

            <p id="emptyMessage">No students added yet.</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
