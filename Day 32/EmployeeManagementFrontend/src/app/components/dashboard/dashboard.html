
<div class="dashboard">

  <header class="topbar">
    <h2>Employee Management</h2>

    <button class="logout-btn" (click)="logout()">
      Logout
    </button>
  </header>

  <main class="content">

    <div class="welcome">
      <h1>Welcome Back!</h1>
      <p>{{ email }}</p>
      <span class="role">{{ role }}</span>
    </div>

    <h2 class="section-title">Management</h2>

    <div class="cards">

      <div class="card" (click)="openEmployees()">
        <div class="card-icon"></div>
        <h3>Manage Employees</h3>
        <p>Add, view, edit and delete employees.</p>
        <span>Open →</span>
      </div>

      @if (role === 'Manager') {
        <div class="card" (click)="openDepartments()">
          <div class="card-icon"></div>
          <h3>Manage Departments</h3>
          <p>Add, view, edit and delete departments.</p>
          <span>Open →</span>
        </div>
      }

    </div>

  </main>

</div>
